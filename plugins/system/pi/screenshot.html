<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screenshot - settings</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090A0F;
    --panel: #12141B;
    --raised: #1B1E28;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ECEDF2;
    --text2: #A6ACBD;
    --label: #8A90A2;
    --ember: #FFB547;
    --mint: #5BE3A5;
    --alert: #FF5C5C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px Manrope, system-ui, sans-serif; }
  .field { margin-bottom: 14px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--label); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; }
  select, input { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; }
  select:focus, input:focus { outline: none; border-color: var(--ember); }
  p.hint { color: var(--text2); margin: 4px 0 0; line-height: 1.5; font-size: 12px; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; }
  li { padding: 6px 10px; margin-bottom: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; justify-content: space-between; }
  .on { color: var(--mint); } .off { color: var(--label); }
  #status { color: var(--alert); font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <div class="field">
    <label for="mode">What to capture</label>
    <select id="mode">
      <option value="fullscreen">Whole desktop (all screens)</option>
      <option value="current">Current monitor</option>
      <option value="window">Active window</option>
    </select>
  </div>
  <div class="field">
    <label for="folder">Folder</label>
    <input id="folder" placeholder="default: Pictures/Screenshots" />
    <p class="hint">Full path. Empty = the default Spectacle folder (Pictures/Screenshots).</p>
  </div>
  <div id="status"></div>
<script>
  'use strict';
  var websocket = null;
  var piUUID = null;
  function $(id) { return document.getElementById(id); }
  function send(msg) {
    if (!websocket || websocket.readyState !== 1) return false;
    websocket.send(JSON.stringify(msg));
    return true;
  }
  function save() {
    var payload = { mode: $('mode').value, folder: $('folder').value.trim() };
    if (!send({ event: 'setSettings', context: piUUID, payload: payload })) $('status').textContent = 'No connection to OpenDeck.';
  }
  $('mode').addEventListener('change', save);
  $('folder').addEventListener('change', save);
  window.connectElgatoStreamDeckSocket = function (inPort, inPropertyInspectorUUID, inRegisterEvent) {
    piUUID = inPropertyInspectorUUID;
    websocket = new WebSocket('ws://127.0.0.1:' + inPort);
    websocket.onopen = function () {
      send({ event: inRegisterEvent, uuid: inPropertyInspectorUUID });
      send({ event: 'getSettings', context: inPropertyInspectorUUID });
    };
    websocket.onmessage = function (msg) {
      var data;
      try { data = JSON.parse(msg.data); } catch (e) { return; }
      if (data.event === 'didReceiveSettings') {
        var s = (data.payload && data.payload.settings) || {};
        $('mode').value = s.mode === 'current' || s.mode === 'window' ? s.mode : 'fullscreen';
        $('folder').value = typeof s.folder === 'string' ? s.folder : '';
      }
    };
    websocket.onclose = function () { $('status').textContent = 'The connection to OpenDeck was closed.'; };
  };
</script>
</body>
</html>
