<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screens - settings</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090A0F;
    --panel: #12141B;
    --raised: #1B1E28;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ECEDF2;
    --text2: #A6ACBD;
    --label: #8A90A2;
    --ember: #FFB547;
    --mint: #5BE3A5;
    --alert: #FF5C5C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px Manrope, system-ui, sans-serif; }
  .field { margin-bottom: 14px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--label); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; }
  select, input { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; }
  select:focus, input:focus { outline: none; border-color: var(--ember); }
  p.hint { color: var(--text2); margin: 4px 0 0; line-height: 1.5; font-size: 12px; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; }
  li { padding: 6px 10px; margin-bottom: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; justify-content: space-between; }
  .on { color: var(--mint); } .off { color: var(--label); }
  #status { color: var(--alert); font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <div class="field">
    <label for="layout">Layout</label>
    <select id="layout">
      <option value="">— select —</option>
      <option value="single">Single screen</option>
      <option value="extend">Extend (all screens)</option>
    </select>
  </div>
  <div class="field" id="outputField">
    <label for="output">Screen</label>
    <select id="output"></select>
    <p class="hint">The other screens will be turned off.</p>
  </div>
  <div class="field">
    <label for="label">Tile name</label>
    <input id="label" maxlength="14" />
    <p class="hint">Empty = default name. Keep it short: about 9 characters fit without truncation.</p>
  </div>
  <div class="field">
    <label>Detected outputs (kscreen-doctor)</label>
    <ul id="outputs"><li class="off">loading…</li></ul>
    <p class="hint">"Extend" restores the last seen layout of both screens (positions, modes).</p>
  </div>
  <div id="status"></div>
<script>
  'use strict';
  var websocket = null;
  var piUUID = null;
  var actionUuid = 'com.miwoli.displays.layout';
  var settings = {};
  var outputs = [];
  function $(id) { return document.getElementById(id); }

  function send(msg) {
    if (!websocket || websocket.readyState !== 1) return false;
    websocket.send(JSON.stringify(msg));
    return true;
  }

  function render() {
    var layout = settings.layout === 'single' || settings.layout === 'extend' ? settings.layout : '';
    $('layout').value = layout;
    $('outputField').hidden = layout !== 'single';
    var select = $('output');
    while (select.firstChild) select.removeChild(select.firstChild);
    var names = outputs.filter(function (o) { return o.connected; }).map(function (o) { return o.name; });
    if (settings.output && names.indexOf(settings.output) < 0) names.push(settings.output);
    names.forEach(function (name) {
      var o = document.createElement('option');
      o.value = name;
      var info = outputs.filter(function (x) { return x.name === name; })[0];
      o.textContent = info ? name + ' (' + info.width + '×' + info.height + ')' : name + ' (not connected)';
      select.appendChild(o);
    });
    if (settings.output) select.value = settings.output;
    $('label').value = typeof settings.label === 'string' ? settings.label : '';

    var list = $('outputs');
    while (list.firstChild) list.removeChild(list.firstChild);
    outputs.forEach(function (o) {
      var li = document.createElement('li');
      var name = document.createElement('span');
      name.textContent = o.name + (o.connected ? ' · ' + o.width + '×' + o.height : '');
      var state = document.createElement('span');
      state.className = o.enabled ? 'on' : 'off';
      state.textContent = !o.connected ? 'disconnected' : o.enabled ? 'enabled' : 'disabled';
      li.appendChild(name);
      li.appendChild(state);
      list.appendChild(li);
    });
    if (outputs.length === 0) {
      var li = document.createElement('li');
      li.className = 'off';
      li.textContent = 'no data from kscreen-doctor';
      list.appendChild(li);
    }
  }

  function save() {
    var layout = $('layout').value;
    var next = { layout: layout, output: layout === 'single' ? $('output').value : '', label: $('label').value.trim() };
    if (layout === 'single' && !next.output) {
      var first = outputs.filter(function (o) { return o.connected; })[0];
      next.output = first ? first.name : '';
    }
    settings = next;
    if (!send({ event: 'setSettings', context: piUUID, payload: next })) $('status').textContent = 'No connection to OpenDeck.';
    render();
  }

  $('layout').addEventListener('change', save);
  $('output').addEventListener('change', save);
  $('label').addEventListener('change', save);

  window.connectElgatoStreamDeckSocket = function (inPort, inPropertyInspectorUUID, inRegisterEvent) {
    piUUID = inPropertyInspectorUUID;
    websocket = new WebSocket('ws://127.0.0.1:' + inPort);
    websocket.onopen = function () {
      send({ event: inRegisterEvent, uuid: inPropertyInspectorUUID });
      send({ event: 'getSettings', context: inPropertyInspectorUUID });
      send({ event: 'sendToPlugin', action: actionUuid, context: inPropertyInspectorUUID, payload: { event: 'getOutputs' } });
    };
    websocket.onmessage = function (msg) {
      var data;
      try { data = JSON.parse(msg.data); } catch (e) { return; }
      if (data.event === 'didReceiveSettings') {
        settings = (data.payload && data.payload.settings) || {};
        render();
      } else if (data.event === 'sendToPropertyInspector' && data.payload && data.payload.event === 'outputs') {
        outputs = Array.isArray(data.payload.outputs) ? data.payload.outputs : [];
        $('label').placeholder = data.payload.defaultLabel || '';
        render();
      }
    };
    websocket.onclose = function () { $('status').textContent = 'The connection to OpenDeck was closed.'; };
  };
</script>
</body>
</html>
